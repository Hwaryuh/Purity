[versions]
kotlin = "2.3.21"
shadow = "9.6.1"
resource-factory = "1.3.1"
paper = "26.3.build.35-alpha"
paperweight = "2.0.0-beta.23"
velocity = "4.2.0"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
kotlin-stdlib-jdk8 = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8", version.ref = "kotlin" }
velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocity" }

[bundles]
paper-library = ["kotlin-stdlib-jdk8"]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
resource-factory-paper = { id = "xyz.jpenilla.resource-factory-paper-convention", version.ref = "resource-factory" }
paperweight-userdev = { id = "io.papermc.paperweight.userdev", version.ref = "paperweight" }
